<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1280" width="1440" height="1280" font-family="Arial,sans-serif"><title>Recorded truck wiring: power, signals and receiver harness</title><desc>A logical connection diagram from the documented historical build. It is not a physical connector orientation drawing or confirmation of the current truck.</desc><defs><marker id="power" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#ae5317"/></marker><marker id="signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#236e9b"/></marker></defs><rect width="1440" height="1280" fill="white"/><text x="30" y="45" font-size="34" fill="#19343b" font-weight="bold">Recorded truck wiring</text><text x="30" y="80" font-size="22" fill="#19343b" font-weight="normal">Logical connections from the guide record. Confirm the actual unit before powered use.</text><text x="30" y="130" font-size="25" fill="#19343b" font-weight="bold">POWER PATHS</text><rect x="30" y="160" width="225" height="75" rx="8" fill="#f3f7f5" stroke="#66847c" stroke-width="2"/><text x="46" y="192" font-size="22" fill="#19343b" font-weight="normal">Traction pack</text><rect x="365" y="160" width="235" height="75" rx="8" fill="#f3f7f5" stroke="#66847c" stroke-width="2"/><text x="381" y="192" font-size="22" fill="#19343b" font-weight="normal">PM02 inline</text><text x="381" y="220" font-size="22" fill="#19343b" font-weight="normal">power module</text><rect x="710" y="160" width="235" height="75" rx="8" fill="#f3f7f5" stroke="#66847c" stroke-width="2"/><text x="726" y="192" font-size="22" fill="#19343b" font-weight="normal">XL-5 ESC</text><rect x="1055" y="160" width="340" height="75" rx="8" fill="#f3f7f5" stroke="#66847c" stroke-width="2"/><text x="1071" y="192" font-size="22" fill="#19343b" font-weight="normal">Brushed drive motor</text><path d="M255 197 H365" fill="none" stroke="#ae5317" stroke-width="3" marker-end="url(#power)"/><path d="M600 197 H710" fill="none" stroke="#ae5317" stroke-width="3" marker-end="url(#power)"/><path d="M945 197 H1055" fill="none" stroke="#ae5317" stroke-width="3" marker-end="url(#power)"/><rect x="365" y="330" width="235" height="75" rx="8" fill="#f3f7f5" stroke="#66847c" stroke-width="2"/><text x="381" y="362" font-size="22" fill="#19343b" font-weight="normal">FC POWER input</text><text x="381" y="390" font-size="22" fill="#19343b" font-weight="normal">Flight-controller logic</text><path d="M482 235 V330" fill="none" stroke="#ae5317" stroke-width="3" marker-end="url(#power)"/><text x="500" y="285" font-size="20" fill="#19343b" font-weight="normal">FC supply only</text><rect x="710" y="330" width="235" height="75" rx="8" fill="#f3f7f5" stroke="#66847c" stroke-width="2"/><text x="726" y="362" font-size="22" fill="#19343b" font-weight="normal">Servo power rail</text><text x="726" y="390" font-size="22" fill="#19343b" font-weight="normal">BEC + and ground</text><path d="M827 235 V330" fill="none" stroke="#ae5317" stroke-width="3" marker-end="url(#power)"/><text x="845" y="275" font-size="20" fill="#19343b" font-weight="normal">XL-5 BEC</text><text x="845" y="303" font-size="20" fill="#19343b" font-weight="normal">via MAIN3 + / −</text><rect x="1055" y="330" width="340" height="75" rx="8" fill="#f3f7f5" stroke="#66847c" stroke-width="2"/><text x="1071" y="362" font-size="22" fill="#19343b" font-weight="normal">Steering servo power</text><text x="1071" y="390" font-size="22" fill="#19343b" font-weight="normal">from MAIN1 rail pins</text><path d="M945 367 H1055" fill="none" stroke="#ae5317" stroke-width="3" marker-end="url(#power)"/><rect x="30" y="465" width="225" height="75" rx="8" fill="#f3f7f5" stroke="#66847c" stroke-width="2"/><text x="46" y="497" font-size="22" fill="#19343b" font-weight="normal">Separate PD bank</text><rect x="365" y="465" width="235" height="75" rx="8" fill="#f3f7f5" stroke="#66847c" stroke-width="2"/><text x="381" y="497" font-size="22" fill="#19343b" font-weight="normal">Orin DC barrel input</text><path d="M255 502 H365" fill="none" stroke="#ae5317" stroke-width="3" marker-end="url(#power)"/><text x="262" y="458" font-size="18" fill="#19343b" font-weight="normal">15 V PD cable</text><rect x="710" y="465" width="685" height="75" rx="8" fill="#f3f7f5" stroke="#66847c" stroke-width="2"/><text x="726" y="497" font-size="22" fill="#19343b" font-weight="normal">Orin USB can also power the FC and receiver.</text><text x="726" y="525" font-size="22" fill="#19343b" font-weight="normal">Pack removal alone is not full isolation.</text><path d="M600 502 H710" fill="none" stroke="#ae5317" stroke-width="3" marker-end="url(#power)"/><text x="30" y="588" font-size="22" fill="#19343b" font-weight="normal">PM02 does not supply the servo rail. Do not join FC +5 V and BEC-positive supplies.</text><text x="30" y="650" font-size="25" fill="#19343b" font-weight="bold">DATA AND CONTROL SIGNALS</text><rect x="30" y="680" width="225" height="75" rx="8" fill="#f3f7f5" stroke="#66847c" stroke-width="2"/><text x="46" y="712" font-size="22" fill="#19343b" font-weight="normal">Phone</text><text x="46" y="740" font-size="22" fill="#19343b" font-weight="normal">USB data cable</text><rect x="365" y="680" width="235" height="75" rx="8" fill="#f3f7f5" stroke="#66847c" stroke-width="2"/><text x="381" y="712" font-size="22" fill="#19343b" font-weight="normal">Orin USB-A host</text><rect x="710" y="680" width="235" height="235" rx="8" fill="#f3f7f5" stroke="#66847c" stroke-width="2"/><text x="726" y="712" font-size="22" fill="#19343b" font-weight="normal">FLIGHT</text><text x="726" y="740" font-size="22" fill="#19343b" font-weight="normal">CONTROLLER</text><text x="726" y="768" font-size="22" fill="#19343b" font-weight="normal"></text><text x="726" y="796" font-size="22" fill="#19343b" font-weight="normal">USB + TELEM1 in</text><text x="726" y="824" font-size="22" fill="#19343b" font-weight="normal">MAIN1 / MAIN3 out</text><path d="M255 717 H365" fill="none" stroke="#236e9b" stroke-width="3" marker-end="url(#signal)"/><path d="M600 717 H710" fill="none" stroke="#236e9b" stroke-width="3" marker-end="url(#signal)"/><text x="630" y="699" font-size="18" fill="#236e9b" font-weight="normal">USB</text><rect x="1055" y="680" width="340" height="75" rx="8" fill="#f3f7f5" stroke="#66847c" stroke-width="2"/><text x="1071" y="712" font-size="22" fill="#19343b" font-weight="normal">Steering servo signal</text><text x="1071" y="740" font-size="22" fill="#19343b" font-weight="normal">FC MAIN1 signal pin</text><path d="M945 717 H1055" fill="none" stroke="#236e9b" stroke-width="3" marker-end="url(#signal)"/><rect x="30" y="840" width="225" height="75" rx="8" fill="#f3f7f5" stroke="#66847c" stroke-width="2"/><text x="46" y="872" font-size="22" fill="#19343b" font-weight="normal">MT12 radio</text><rect x="365" y="840" width="235" height="75" rx="8" fill="#f3f7f5" stroke="#66847c" stroke-width="2"/><text x="381" y="872" font-size="22" fill="#19343b" font-weight="normal">ER5C-i receiver</text><text x="381" y="900" font-size="22" fill="#19343b" font-weight="normal">CRSF UART</text><rect x="1055" y="840" width="340" height="75" rx="8" fill="#f3f7f5" stroke="#66847c" stroke-width="2"/><text x="1071" y="872" font-size="22" fill="#19343b" font-weight="normal">XL-5 throttle signal</text><text x="1071" y="900" font-size="22" fill="#19343b" font-weight="normal">FC MAIN3 signal pin</text><path d="M255 877 H365" fill="none" stroke="#236e9b" stroke-width="3" marker-end="url(#signal)"/><text x="280" y="854" font-size="18" fill="#236e9b" font-weight="normal">ELRS</text><path d="M600 877 H710" fill="none" stroke="#236e9b" stroke-width="3" marker-end="url(#signal)"/><text x="610" y="855" font-size="18" fill="#236e9b" font-weight="normal">TELEM1</text><path d="M945 877 H1055" fill="none" stroke="#236e9b" stroke-width="3" marker-end="url(#signal)"/><text x="30" y="963" font-size="25" fill="#19343b" font-weight="bold">TELEM1 RECEIVER HARNESS — logical pin mapping</text><text x="50" y="1004" font-size="22" fill="#19343b" font-weight="normal">GH 1  +5 V</text><text x="590" y="1004" font-size="22" fill="#19343b" font-weight="normal">→</text><text x="640" y="1004" font-size="22" fill="#19343b" font-weight="normal">Receiver + rail</text><text x="50" y="1040" font-size="22" fill="#19343b" font-weight="normal">GH 2  FC TX</text><text x="590" y="1040" font-size="22" fill="#19343b" font-weight="normal">→</text><text x="640" y="1040" font-size="22" fill="#19343b" font-weight="normal">Receiver CH3 signal / Serial RX</text><text x="50" y="1076" font-size="22" fill="#19343b" font-weight="normal">GH 3  FC RX</text><text x="590" y="1076" font-size="22" fill="#19343b" font-weight="normal">→</text><text x="640" y="1076" font-size="22" fill="#19343b" font-weight="normal">Receiver CH2 signal / Serial TX</text><text x="50" y="1112" font-size="22" fill="#19343b" font-weight="normal">GH 6  Ground</text><text x="590" y="1112" font-size="22" fill="#19343b" font-weight="normal">→</text><text x="640" y="1112" font-size="22" fill="#19343b" font-weight="normal">Receiver − rail</text><text x="50" y="1148" font-size="22" fill="#19343b" font-weight="normal">GH 4 / GH 5</text><text x="590" y="1148" font-size="22" fill="#19343b" font-weight="normal">→</text><text x="640" y="1148" font-size="22" fill="#19343b" font-weight="normal">Unused; insulate</text><text x="30" y="1210" font-size="22" fill="#19343b" font-weight="normal">Six-position GH 1.25 mm → four individual female 2.54 mm receiver sockets.</text><text x="30" y="1247" font-size="20" fill="#19343b" font-weight="normal">Not cable-face orientation. Use Holybro’s pin-1 drawing and verify continuity/polarity; ignore wire colours.</text></svg>